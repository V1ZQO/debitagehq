<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'">
<title>DebitageHQ</title>
<style>
@font-face{font-family:Inter;font-weight:400;src:url(fonts2/inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Inter;font-weight:600;src:url(fonts2/inter-latin-600-normal.woff2) format('woff2')}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:Inter,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;user-select:none;cursor:default}
.card{position:absolute;inset:10px;border-radius:16px;overflow:hidden;-webkit-app-region:drag;
background:radial-gradient(120% 80% at 50% 28%,rgba(200,30,40,.28),transparent 55%),radial-gradient(90% 70% at 50% 110%,rgba(40,70,220,.22),transparent 60%),#121216;
box-shadow:0 0 0 1px rgba(255,255,255,.07),0 18px 50px rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#f2f2f4;animation:in .45s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:scale(.96)}}
.logo{width:104px;height:104px;border-radius:24px;position:relative;margin-top:-6px}
.logo img{width:100%;height:100%;display:block;border-radius:24px;position:relative;z-index:1}
.logo::before{content:"";position:absolute;inset:-18px;border-radius:40px;background:radial-gradient(closest-side,rgba(230,40,50,.75),transparent);filter:blur(14px);animation:siren 1.6s ease-in-out infinite}
.logo::after{content:"";position:absolute;inset:-18px;border-radius:40px;background:radial-gradient(closest-side,rgba(50,90,255,.75),transparent);filter:blur(14px);opacity:0;animation:siren 1.6s ease-in-out infinite .8s}
@keyframes siren{0%,100%{opacity:0}35%,50%{opacity:1}}
h1{margin:22px 0 2px;font-size:24px;font-weight:600;letter-spacing:-.01em}
.sub{font-size:12px;color:#8d8d95}
.status{margin-top:34px;font-size:12.5px;color:#c9c9cf;height:18px}
.bar{margin-top:10px;width:260px;height:4px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;width:6%;border-radius:4px;background:linear-gradient(90deg,#e0262f,#ff4d57 60%,#4d6dff);box-shadow:0 0 12px rgba(255,60,70,.7);transition:width .45s cubic-bezier(.3,.7,.2,1)}
.ver{position:absolute;bottom:16px;font-size:11px;color:#6b6b73}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><img src="logo.png" alt=""></div>
  <h1>DebitageHQ</h1>
  <div class="sub">Espace de l'équipe</div>
  <div class="status" id="status">Démarrage…</div>
  <div class="bar"><i id="bar"></i></div>
  <div class="ver" id="ver"></div>
</div>
<script src="splash.js"></script>
</body>
</html>
