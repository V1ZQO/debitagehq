<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
<title>DebitageHQ : session à distance</title>
<style>
@font-face{font-family:Inter;font-weight:600;src:url(fonts2/inter-latin-600-normal.woff2) format('woff2')}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font:600 13px Inter,"Segoe UI",sans-serif;color:#fff;user-select:none}
.b{position:absolute;inset:4px;border-radius:10px;background:linear-gradient(90deg,#7a121b,#a3141f);box-shadow:0 0 0 1px rgba(255,255,255,.15),0 8px 24px rgba(0,0,0,.5);display:flex;align-items:center;gap:10px;padding:0 6px 0 14px;-webkit-app-region:drag}
.dot{width:9px;height:9px;border-radius:50%;background:#fff;animation:p 1.2s ease-in-out infinite}@keyframes p{50%{opacity:.25}}
#t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{-webkit-app-region:no-drag;font:inherit;height:28px;padding:0 14px;border-radius:7px;border:0;background:#fff;color:#a3141f;cursor:pointer}
button:hover{background:#ffe1e3}
</style></head>
<body><div class="b"><span class="dot"></span><span id="t">Session à distance en cours</span><button id="stop">Arrêter</button></div>
<script src="banner.js"></script></body></html>
